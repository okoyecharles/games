<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Platformer</title>
  <link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Gasoek+One&display=swap" rel="stylesheet">
	<script src="https://kit.fontawesome.com/ea233bda26.js" crossorigin="anonymous"></script>
</head>
<body>
	<a id="logo" href="https://okoyecharles.com" rel="noopener noreferrer" target="_blank" title="Portfolio">
		<img src="assets/portolio-logo.svg" alt="Portfolio Logo">
	</a>
	<div class="container">
		<div class="buttons">
			<button id="Left" class="hidden left control"><i class="fa-solid fa-caret-left"></i></button>
      <button id="Right" class="hidden left control"><i class="fa-solid fa-caret-right"></i></button>
      <button id="Restart" class="hidden center normal">Restart</button>
      <button id="Jump" class="hidden right control"><i class="fa-solid fa-circle-dot"></i></button>
		</div>
		<canvas id="game"></canvas>
		<div id="game-over" class="game-over hidden">
			<h1>Game Over</h1>
			<p>Press <b>Enter</b> to restart</p>
		</div>
	</div>
	<script src="src/main.js" type="module"></script>
</body>
</html>
